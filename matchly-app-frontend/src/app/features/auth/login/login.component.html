<div class="login-container">
  <div class="login-background">
    <div class="puzzle-piece piece1"></div>
    <div class="puzzle-piece piece2"></div>
    <div class="puzzle-piece piece3"></div>
    <div class="puzzle-piece piece4"></div>
    <div class="puzzle-piece piece5"></div>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
    <h1>Вход</h1>

    <input type="text" placeholder="Потребителско име" formControlName="username" name="username"
      [class.invalid]="loginForm.get('username')?.touched && loginForm.get('username')?.invalid" 
      [class.valid]="loginForm.get('username')?.touched && loginForm.get('username')?.valid">
    <div *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid" style="color: rgb(172, 50, 50);">

      <div *ngIf="loginForm.get('username')?.errors?.['required']">
        Полето не може да бъде празно!
      </div>

      <div *ngIf="loginForm.get('username')?.errors?.['minlength']">
        Минимум 3 символа!
      </div>

      <div *ngIf="loginForm.get('username')?.errors?.['maxlength']">
        Максимум 20 символа!
      </div>

    </div>


    <input type="password" placeholder="Парола" formControlName="password" name="password"
      [class.invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" 
      [class.valid]="loginForm.get('password')?.touched && loginForm.get('password')?.valid">
    <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" style="color: rgb(172, 50, 50);">

      <div *ngIf="loginForm.get('password')?.errors?.['required']">
        Полето не може да бъде празно!
      </div>

      <div *ngIf="loginForm.get('password')?.errors?.['minlength']">
        Минимум 3 символа!
      </div>

      <div *ngIf="loginForm.get('password')?.errors?.['maxlength']">
        Максимум 20 символа!
      </div>

    </div>


    <button type="submit" [disabled]="loginForm.invalid">Вход</button>
    <p class="form-already">Все още нямаш акаунт? <a routerLink="/register">Регистрирай се!</a></p>

  </form>
</div>
